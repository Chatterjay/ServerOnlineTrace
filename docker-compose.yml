services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tracesession
      POSTGRES_PASSWORD: tracesession
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./Timing Server Record Backend/backend
    ports:
      - "27890:27890"
      - "27891:27891"
    environment:
      DATABASE_URL: postgresql://postgres:tracesession@db:5432/tracesession
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./Timing Server Record Backend/frontend
    ports:
      - "27892:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
